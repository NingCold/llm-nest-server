name: Prepare server image
on:
  workflow_dispatch:
    inputs:
      web_version:
        description: Exact client Web version
        required: true
      web_url:
        description: Permanent URL for the versioned Web tar.gz
        required: true
      web_manifest_url:
        description: Permanent URL for its SHA-256 manifest
        required: true
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      WEB_VERSION: ${{ inputs.web_version }}
      WEB_URL: ${{ inputs.web_url }}
      WEB_MANIFEST_URL: ${{ inputs.web_manifest_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare fixed inputs
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          python scripts/release.py validate
          cargo fetch --locked
          mkdir artifact
          curl --fail --location --proto '=https' "$WEB_URL" --output artifact/web.tar.gz
          curl --fail --location --proto '=https' "$WEB_MANIFEST_URL" --output artifact/web-manifest.json
          python scripts/prepare-cloud-context.py --web-artifact artifact/web.tar.gz --web-manifest artifact/web-manifest.json --web-version "$WEB_VERSION" --output artifact/context
      - name: Build image and save checksums
        run: |
          docker build --tag llmn-server:review artifact/context
          docker image inspect llmn-server:review > artifact/image-manifest.json
          docker save llmn-server:review | gzip > artifact/llmn-server-image.tar.gz
          sha256sum artifact/llmn-server-image.tar.gz > artifact/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-image-review
          path: |
            artifact/llmn-server-image.tar.gz
            artifact/image-manifest.json
            artifact/web-manifest.json
            artifact/SHA256SUMS
