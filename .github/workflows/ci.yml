name: Server checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CLOUD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/llmn_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmn_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked
          python scripts/release.py validate
          python scripts/test_release.py
          python scripts/check-boundaries.py
          python scripts/test_migrate_local.py
          python scripts/test_build_artifacts.py
          python scripts/test_clean_build_artifacts.py
          npm ci --ignore-scripts --prefix tests/integration
